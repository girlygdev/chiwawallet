# Lint, type check and unit tests on every push and pull request.
# No secrets: none of these steps talk to Supabase. Database tests
# (npm run test:db) need Docker and local Supabase, so they run locally only.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run, saving minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # the same as local dev: npm 11 wrote package-lock.json
          cache: npm # reuses downloaded packages between runs
      # Clean install from package-lock.json, like Vercel does.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
